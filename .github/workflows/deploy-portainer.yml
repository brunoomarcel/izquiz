name: Deploy na VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-izquiz-vps
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar configurações obrigatórias
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Configure o secret VPS_HOST}"
          : "${VPS_USER:?Configure o secret VPS_USER}"
          : "${VPS_SSH_KEY:?Configure o secret VPS_SSH_KEY}"
          : "${VPS_DEPLOY_PATH:?Configure o secret VPS_DEPLOY_PATH}"
          : "${NEXT_PUBLIC_SUPABASE_URL:?Configure o secret NEXT_PUBLIC_SUPABASE_URL}"
          : "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Configure o secret NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Configure o secret SUPABASE_SERVICE_ROLE_KEY}"
      - name: Configurar acesso SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Gerar configuração de produção
        id: render
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ vars.NEXT_PUBLIC_APP_DOMAIN || 'izquiz.stuffshub.com' }}
          IZQUIZ_MCP_TOKEN: ${{ secrets.IZQUIZ_MCP_TOKEN }}
          IZQUIZ_MCP_USER_ID: ${{ secrets.IZQUIZ_MCP_USER_ID }}
          MCP_PUBLIC_URL: ${{ vars.MCP_PUBLIC_URL || 'https://izquiz.stuffshub.com/mcp' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          KEY_HASH="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | sha256sum | cut -c1-12)"
          SECRET_NAME="izquiz_supabase_service_role_key_${KEY_HASH}"
          ENV_FILE="$GITHUB_WORKSPACE/.env.production"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}"
            printf 'NEXT_PUBLIC_APP_DOMAIN=%s\n' "$NEXT_PUBLIC_APP_DOMAIN"
            printf 'IZQUIZ_MCP_TOKEN=%s\n' "$IZQUIZ_MCP_TOKEN"
            printf 'IZQUIZ_MCP_USER_ID=%s\n' "$IZQUIZ_MCP_USER_ID"
            printf 'MCP_PUBLIC_URL=%s\n' "$MCP_PUBLIC_URL"
            printf 'SUPABASE_SERVICE_ROLE_SECRET_NAME=%s\n' "$SECRET_NAME"
          } > "$ENV_FILE"
          chmod 600 "$ENV_FILE"
          echo "secret_name=$SECRET_NAME" >> "$GITHUB_OUTPUT"

      - name: Enviar arquivos para a VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          EXCLUDE_FILE="$(mktemp)"
          trap 'rm -f "$EXCLUDE_FILE"' EXIT
          cat > "$EXCLUDE_FILE" <<'EOF'
          .git/
          .github/
          node_modules/
          **/node_modules/
          .next/
          **/.next/
          coverage/
          *.log
          *.tsbuildinfo
          .env
          .env.*
          EOF
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH'"
          rsync -az --checksum --delete --delay-updates \
            --exclude-from="$EXCLUDE_FILE" \
            -e "ssh -p $PORT" \
            "$GITHUB_WORKSPACE/" "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          rsync -az --checksum -e "ssh -p $PORT" \
            "$GITHUB_WORKSPACE/.env.production" \
            "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/.env.production"

      - name: Criar secret e publicar stack no Swarm
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_NAME: ${{ steps.render.outputs.secret_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          TAG="${GITHUB_SHA::12}"

          # Envia a chave pelo stdin do SSH; ela não entra no .env nem nos argumentos do processo.
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "if docker secret inspect '$SECRET_NAME' >/dev/null 2>&1; then cat >/dev/null; echo 'Secret do Supabase já existe.'; else docker secret create '$SECRET_NAME' -; fi"

          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "REMOTE_PATH='$VPS_DEPLOY_PATH' SECRET_NAME='$SECRET_NAME' TAG='$TAG' bash -s" <<'EOF'
          set -euo pipefail
          cd "$REMOTE_PATH"
          chmod 600 .env.production
          set -a
          # shellcheck disable=SC1091
          . ./.env.production
          set +a

          # Compose needs the exact versioned Docker Secret name created above.
          export SUPABASE_SERVICE_ROLE_SECRET_NAME="$SECRET_NAME"

          docker info --format '{{.Swarm.LocalNodeState}}' | grep -qx active
          export IZQUIZ_IMAGE="izquiz:${TAG}"
          docker build \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" \
            --build-arg "NEXT_PUBLIC_APP_DOMAIN=$NEXT_PUBLIC_APP_DOMAIN" \
            -t "$IZQUIZ_IMAGE" .

          STACK_CONFIG="$(docker stack config -c docker-compose.portainer.yml)"
          if ! printf '%s' "$STACK_CONFIG" | grep -Fq "$SECRET_NAME"; then
            echo "A stack não resolveu o secret versionado do Supabase." >&2
            exit 1
          fi
          docker stack deploy --resolve-image never -c docker-compose.portainer.yml izquiz

          # Remove versões antigas apenas depois do serviço trocar para o novo secret.
          docker secret ls --format '{{.Name}}' | while IFS= read -r old_secret; do
            case "$old_secret" in
              izquiz_supabase_service_role_key_*)
                if [ "$old_secret" != "$SECRET_NAME" ]; then
                  docker secret rm "$old_secret" || true
                fi
                ;;
            esac
          done
          EOF

      - name: Limpar configuração temporária
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.env.production"
